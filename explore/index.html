<html data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Explore NYC Weather History</title>
        <link rel="stylesheet" href="../css/pico.min.css" />
        <link rel="stylesheet" href="../css/app.css" />
        <style>
            .container {
                max-width: 960px;
            }
            /* Pico nav: plain right-aligned words, active one underlined. */
            .tabs {
                margin-top: 0.5rem;
                justify-content: flex-end;
            }
            /* nav.tabs beats Pico's default nav ul/li spacing so the last tab's
               right edge lines up with the content column (dropdowns / modal X). */
            nav.tabs ul {
                padding: 0;
                margin: 0;
                gap: 0.9rem;
            }
            nav.tabs li {
                padding: 0;
            }
            .tabs a {
                padding: 0.2rem 0;
                margin: 0;
                color: var(--secondary);
                text-decoration: none;
            }
            .tabs a:hover,
            .tabs a:focus {
                background: transparent;
                box-shadow: none;
                color: var(--color);
            }
            .tabs a.active {
                color: #3b6ea5;
                font-weight: 600;
                text-decoration: underline;
                text-underline-offset: 5px;
                text-decoration-thickness: 2px;
            }
            #chart {
                margin-top: 0.5rem;
            }
            /* Controls sit below the chart. */
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem 0.75rem;
                align-items: end;
                margin-top: 1rem;
            }
            /* Date (Month/Day) and range (From/To) each stay together, so when
               the row can't fit all four the range wraps as a unit (2 + 2). */
            .control-group {
                display: flex;
                gap: 0.4rem 0.75rem;
                flex: 1 1 15rem;
            }
            .controls label {
                flex: 1 1 7rem;
                margin: 0;
                font-size: 0.72rem;
                letter-spacing: 0.02em;
                text-transform: uppercase;
                color: var(--secondary);
            }
            .controls select {
                margin: 0.2rem 0 0;
                padding: 0.3rem 1.6rem 0.3rem 0.55rem;
                font-size: 0.85rem;
                height: auto;
                background-position: center right 0.6rem;
            }
            #hour-modal article {
                max-width: 820px;
                width: 90vw;
            }
            #hour-modal header {
                margin-bottom: 0.5rem;
            }
            .modal-tabs {
                justify-content: flex-end;
                margin: 0 0 0.25rem;
            }
            .modal-summary {
                color: var(--secondary);
                font-size: 0.9rem;
                margin: 0.5rem 0 0;
            }
            /* On phones, tighten the page and let the chart reach the edges. */
            @media (max-width: 600px) {
                .container {
                    padding-left: 0.5rem;
                    padding-right: 0.5rem;
                }
                #chart {
                    margin-left: -0.5rem;
                    margin-right: -0.5rem;
                }
                #hour-modal article {
                    width: 96vw;
                    padding-left: 0.5rem;
                    padding-right: 0.5rem;
                }
                #modal-chart {
                    margin-left: -0.25rem;
                    margin-right: -0.25rem;
                }
            }
        </style>
    </head>
    <body>
        <main class="container">
            <hgroup>
                <h1>New York on <b id="title-date">…</b></h1>
                <h2><span id="explainer">Loading…</span></h2>
            </hgroup>

            <nav class="tabs">
                <ul>
                    <li><a href="#" data-mode="temp" class="active">Temperature</a></li>
                    <li><a href="#" data-mode="feels">Feels Like</a></li>
                    <li><a href="#" data-mode="precip">Precipitation</a></li>
                </ul>
            </nav>

            <div id="chart"></div>

            <div class="controls">
                <div class="control-group">
                    <label>Month <select id="month"></select></label>
                    <label>Day <select id="day"></select></label>
                </div>
                <div class="control-group">
                    <label>From <select id="yearStart"></select></label>
                    <label>To <select id="yearEnd"></select></label>
                </div>
            </div>
        </main>

        <dialog id="hour-modal">
            <article>
                <header>
                    <a
                        href="#"
                        id="modal-close"
                        aria-label="Close"
                        class="close"
                    ></a>
                    <strong id="modal-title"></strong>
                </header>
                <nav class="tabs modal-tabs">
                    <ul>
                        <li><a href="#" data-mtab="dist" class="active">Distribution</a></li>
                        <li><a href="#" data-mtab="years">History</a></li>
                    </ul>
                </nav>
                <div id="modal-chart"></div>
                <p id="modal-summary" class="modal-summary"></p>
            </article>
        </dialog>

        <script src="../js/apexcharts.min.js"></script>
        <script src="../js/wedding-temps.js"></script>
        <script src="../js/wedding-feels.js"></script>
        <script src="../js/wedding-precip.js"></script>
        <script src="../js/wedding.js"></script>
    </body>
</html>
