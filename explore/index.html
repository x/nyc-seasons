<html data-theme="light">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Explore NYC Weather History</title>
        <link rel="stylesheet" href="../css/pico.min.css" />
        <link rel="stylesheet" href="../css/app.css" />
        <style>
            .container {
                max-width: 960px;
            }
            /* Pico nav: plain right-aligned words, active one underlined. */
            .tabs {
                margin-top: 0.5rem;
                justify-content: flex-end;
            }
            .tabs ul {
                padding: 0;
                margin: 0;
                gap: 0.5rem;
            }
            .tabs a {
                padding: 0.2rem 0.3rem;
                color: var(--secondary);
                text-decoration: none;
            }
            .tabs a:hover,
            .tabs a:focus {
                background: transparent;
                box-shadow: none;
                color: var(--color);
            }
            .tabs a.active {
                color: #3b6ea5;
                font-weight: 600;
                text-decoration: underline;
                text-underline-offset: 5px;
                text-decoration-thickness: 2px;
            }
            #chart {
                margin-top: 0.5rem;
            }
            /* Controls sit below the chart. */
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem 0.75rem;
                align-items: end;
                margin-top: 1rem;
            }
            .controls label {
                flex: 1 1 7rem;
                margin: 0;
                font-size: 0.72rem;
                letter-spacing: 0.02em;
                text-transform: uppercase;
                color: var(--secondary);
            }
            .controls select {
                margin: 0.2rem 0 0;
                padding: 0.3rem 1.6rem 0.3rem 0.55rem;
                font-size: 0.85rem;
                height: auto;
                background-position: center right 0.6rem;
            }
            #hour-modal article {
                max-width: 820px;
                width: 90vw;
            }
            #hour-modal header {
                margin-bottom: 0.5rem;
            }
        </style>
    </head>
    <body>
        <main class="container">
            <hgroup>
                <h1>New York on <b id="title-date">…</b></h1>
                <h2><span id="explainer">Loading…</span></h2>
            </hgroup>

            <nav class="tabs">
                <ul>
                    <li><a href="#" data-mode="temp" class="active">Temperature</a></li>
                    <li><a href="#" data-mode="feels">Feels Like</a></li>
                    <li><a href="#" data-mode="precip">Precipitation</a></li>
                </ul>
            </nav>

            <div id="chart"></div>

            <div class="controls">
                <label>Month <select id="month"></select></label>
                <label>Day <select id="day"></select></label>
                <label>From <select id="yearStart"></select></label>
                <label>To <select id="yearEnd"></select></label>
            </div>
        </main>

        <dialog id="hour-modal">
            <article>
                <header>
                    <a
                        href="#"
                        id="modal-close"
                        aria-label="Close"
                        class="close"
                    ></a>
                    <strong id="modal-title"></strong>
                </header>
                <div id="modal-chart"></div>
            </article>
        </dialog>

        <script src="../js/apexcharts.min.js"></script>
        <script src="../js/wedding-temps.js"></script>
        <script src="../js/wedding-feels.js"></script>
        <script src="../js/wedding-precip.js"></script>
        <script src="../js/wedding.js"></script>
    </body>
</html>
